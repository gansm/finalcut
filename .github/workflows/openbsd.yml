name: "OpenBSD build"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 2'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
    - name: Repository checkout
      uses: actions/checkout@v6

    - name: Test on OpenBSD 7.9 - https://github.com/cross-platform-actions/action
      uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3  # 1.7.0
      with:
        operating_system: openbsd
        version: '7.9'
        run: |
          uname -a
          whoami
          pwd
          # http://ftp.openbsd.org/pub/OpenBSD/7.9/packages/amd64/
          sudo pkg_add gcc g++ automake-1.18.1 autoconf-2.72p0 autoconf-archive libtool cppunit
          export CXX=eg++
          export AUTOCONF_VERSION=2.72
          export AUTOMAKE_VERSION=1.18
          eg++ --version
          autoreconf -v --install --force
          ./configure --prefix=/usr
          CPU_COUNT="$( ( ( getconf _NPROCESSORS_ONLN 2>/dev/null || (getconf NPROCESSORS_ONLN 2>/dev/null) ) || nprocx 2>/dev/null ) || echo "1")"
          JOBS="$(( $((CPU_COUNT / 2)) > 1 ? $((CPU_COUNT / 2)) : 1 ))"
          make -j$JOBS


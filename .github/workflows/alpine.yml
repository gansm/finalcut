name: "Alpine Linux build"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Repository checkout
      uses: actions/checkout@v4

    - name: Install latest Alpine Linux
      uses: jirutka/setup-alpine@v1  # see https://github.com/jirutka/setup-alpine
      with:
        arch: x86_64
        branch: latest-stable
        apk-tools-url: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.10/x86_64/apk.static#!sha256!34bb1a96f0258982377a289392d4ea9f3f4b767a4bb5806b1b87179b79ad8a1c
        packages: >
          gcc
          g++
          make
          automake
          autoconf
          autoconf-archive
          libtool
          pkgconf
          gpm
          gpm-dev
          linux-headers
          ncurses-dev
          ncurses-terminfo
          cppunit

    - name: Test on Alpine Linux environment
      run: |
        uname -a
        whoami
        pwd
        g++ --version
        autoreconf --force --install --verbose --warnings=all
        automake --add-missing --copy
        ./configure --prefix=/usr
        CPU_COUNT="$( ( ( getconf _NPROCESSORS_ONLN 2>/dev/null || (getconf NPROCESSORS_ONLN 2>/dev/null) ) || nprocx 2>/dev/null ) || echo "1")"
        JOBS="$(( $((CPU_COUNT / 2)) > 1 ? $((CPU_COUNT / 2)) : 1 ))"
        make -j$JOBS
      shell: alpine.sh {0}


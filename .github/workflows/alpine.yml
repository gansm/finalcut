name: "Alpine Linux build"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Repository checkout
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3

    - name: Install latest Alpine Linux - https://github.com/jirutka/setup-alpine
      uses: jirutka/setup-alpine@0beccea740ebde8a36498414a82e7da498b21196  # v1
      with:
        arch: x86_64
        branch: latest-stable
        packages: >
          gcc
          g++
          make
          automake
          autoconf
          autoconf-archive
          libtool
          pkgconf
          gpm
          gpm-dev
          linux-headers
          ncurses-dev
          ncurses-terminfo
          cppunit

    - name: Test on Alpine Linux environment
      run: |
        uname -a
        whoami
        pwd
        g++ --version
        autoreconf --force --install --verbose --warnings=all
        automake --add-missing --copy
        ./configure --prefix=/usr
        CPU_COUNT="$( ( ( getconf _NPROCESSORS_ONLN 2>/dev/null || (getconf NPROCESSORS_ONLN 2>/dev/null) ) || nprocx 2>/dev/null ) || echo "1")"
        JOBS="$(( $((CPU_COUNT / 2)) > 1 ? $((CPU_COUNT / 2)) : 1 ))"
        make -j$JOBS
      shell: alpine.sh {0}

